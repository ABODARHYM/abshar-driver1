name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📋 Show files
        run: |
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== google-services.json check ==="
          if [ -f "google-services.json" ]; then
            echo "✅ google-services.json EXISTS"
            echo "=== Content (first 10 lines) ==="
            head -10 google-services.json
          else
            echo "❌ google-services.json MISSING"
            exit 1
          fi

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📁 Create web directory
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.mp3 www/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          echo "=== www files ==="
          ls -la www/

      - name: 📝 Create package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "abshar-driver",
            "version": "1.0.0",
            "description": "Absher Be - Driver App",
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0",
              "@capacitor/push-notifications": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF

      - name: 📥 Install dependencies
        run: npm install

      - name: 🏗️ Init Capacitor
        run: npx cap init "Absher" com.abshar.driver --web-dir=www --confirm

      - name: 🔧 Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: 📋 Copy google-services.json
        run: |
          cp google-services.json android/app/google-services.json
          echo "=== Copied ==="
          cat android/app/google-services.json | grep package_name

      - name: 🎨 Add google-services plugin
        run: |
          sed -i "1a apply plugin: 'com.google.gms.google-services'" android/app/build.gradle
          echo "=== First 5 lines ==="
          head -5 android/app/build.gradle

      - name: 🔨 Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abshar-driver-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
